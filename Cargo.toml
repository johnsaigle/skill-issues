[package]
name = "skill-issues"
version = "0.1.0"
edition = "2024"
description = "A linter for skill markdown files - prevents prompt injection"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
regex = "1.11"
anyhow = "1.0"
colored = "2.2"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
serde-sarif = "0.8"
rayon = "1.10"

[profile.dev]
overflow-checks = true
# Line tables are enough for backtraces; full debuginfo for C and async dependencies dominated target/.
debug = "line-tables-only"

[profile.release]
overflow-checks = true
lto = "fat"
opt-level = 3
strip = "debuginfo"
incremental = true

[lints.clippy]
complexity = "warn"
correctness = "warn"
nursery = "warn"
pedantic = "warn"
perf = "warn"
suspicious = "warn"
allow_attributes_without_reason = "warn"

# Cargo's own lints (stable since Rust 1.100).
# https://doc.rust-lang.org/stable/cargo/reference/lints.html
[lints.cargo]
# Unused dependencies slow down compilation. The warning only appears when
# every build target that may use a dependency table is built (plain
# `cargo check`, not `--bin foo`); dev-dependencies are not checked.
unused_dependencies = "warn"
# Entries in [workspace.dependencies] that no member inherits are misleading.
unused_workspace_dependencies = "warn"
