name: Release

on:
  push:
    branches: [main]
    paths: ['Cargo.toml']
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          persist-credentials: false

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check_tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Rust
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          cache: false

      - name: Build release binary
        if: steps.check_tag.outputs.exists == 'false'
        run: cargo build --release --locked --verbose

      - name: Prepare binary
        if: steps.check_tag.outputs.exists == 'false'
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          mkdir -p dist
          cp target/release/$REPO_NAME dist/$REPO_NAME-linux-x64
          chmod +x dist/$REPO_NAME-linux-x64

      - name: Create Release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: gh release create "$TAG" dist/$REPO_NAME-linux-x64 --generate-notes --latest
